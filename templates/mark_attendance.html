{% extends "base.html" %}

{% block title %}
Mark Attendance
{% endblock %}

{% block content %}

<style>

    .attendance-card {
        border: none;
        border-radius: 18px;
        overflow: hidden;
    }

    .attendance-header {
        background: linear-gradient(135deg, #198754, #20c997);
        padding: 20px 25px;
    }

    .attendance-header h3 {
        margin: 0;
        font-weight: 600;
    }

    .form-label {
        color: #333;
    }

    .form-control,
    .form-select {
        border-radius: 10px;
        padding: 12px;
        transition: 0.3s;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #198754;
        box-shadow: 0 0 0 0.2rem rgba(25, 135, 84, 0.15);
    }

    .save-btn {
        border-radius: 10px;
        padding: 11px 25px;
        font-weight: 600;
    }

    .cancel-btn {
        border-radius: 10px;
        padding: 11px 25px;
    }

    .date-info {
        font-size: 13px;
        color: #6c757d;
        margin-top: 6px;
    }

    @media (max-width: 576px) {

        .attendance-card {
            border-radius: 14px;
        }

        .attendance-header {
            padding: 17px;
        }

        .attendance-header h3 {
            font-size: 21px;
        }

        .card-body {
            padding: 20px !important;
        }

        .save-btn,
        .cancel-btn {
            width: 100%;
            margin-top: 8px;
        }

    }

</style>


<div class="row justify-content-center mt-3">

    <div class="col-md-7 col-lg-6">

        <div class="card shadow attendance-card">

            <!-- HEADER -->

            <div class="attendance-header text-white">

                <h3>
                    📝 Mark Attendance
                </h3>

                <small>
                    Record employee attendance
                </small>

            </div>


            <!-- BODY -->

            <div class="card-body p-4">

                <form
                    action="/save_attendance"
                    method="POST">


                    <!-- =========================
                         EMPLOYEE
                    ========================== -->

                    <div class="mb-4">

                        <label class="form-label fw-bold">

                            👤 Employee

                        </label>

                        <select
                            name="employee_id"
                            class="form-select"
                            required>

                            <option value="" selected disabled>

                                Select Employee

                            </option>

                            {% for employee in employees %}

                            <option value="{{ employee.id }}">

                                {{ employee.emp_id }}
                                -
                                {{ employee.fullname }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <!-- =========================
                         DATE
                    ========================== -->

                    <div class="mb-4">

                        <label
                            for="attendance_date"
                            class="form-label fw-bold">

                            📅 Attendance Date

                        </label>

                        <input
                            type="date"
                            name="attendance_date"
                            id="attendance_date"
                            class="form-control"
                            required>

                        <div class="date-info">

                            ℹ️ Future dates are not allowed.

                        </div>

                    </div>


                    <!-- =========================
                         STATUS
                    ========================== -->

                    <div class="mb-4">

                        <label
                            for="status"
                            class="form-label fw-bold">

                            📌 Attendance Status

                        </label>

                        <select
                            name="status"
                            id="status"
                            class="form-select"
                            required>

                            <option value="" selected disabled>

                                Select Status

                            </option>

                            <option value="Present">

                                ✅ Present

                            </option>

                            <option value="Absent">

                                ❌ Absent

                            </option>

                            <option value="Leave">

                                🏖️ Leave

                            </option>

                        </select>

                    </div>


                    <!-- =========================
                         BUTTONS
                    ========================== -->

                    <div class="d-flex gap-2 flex-wrap">

                        <button
                            type="submit"
                            class="btn btn-success save-btn">

                            💾 Save Attendance

                        </button>


                        <a
                            href="/attendance"
                            class="btn btn-secondary cancel-btn">

                            ← Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- =========================
     DATE VALIDATION
========================== -->

<script>

    const dateInput =
        document.getElementById("attendance_date");


    // Get today's date

    const today = new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            today.getDate()
        ).padStart(2, "0");


    const todayDate =
        `${year}-${month}-${day}`;


    // Set today's date automatically

    dateInput.value = todayDate;


    // Prevent future dates

    dateInput.max = todayDate;

</script>

{% endblock %}
