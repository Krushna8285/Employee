<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System - Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #c922a2,
                    #7c3aed
                );
        }


        /* Animated background circles */

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            animation: float 7s infinite ease-in-out;
        }

        .circle-one {
            width: 280px;
            height: 280px;
            top: -80px;
            left: -80px;
        }

        .circle-two {
            width: 350px;
            height: 350px;
            bottom: -130px;
            right: -100px;
            animation-delay: 2s;
        }

        .circle-three {
            width: 120px;
            height: 120px;
            top: 15%;
            right: 15%;
            animation-delay: 1s;
        }


        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-25px) rotate(10deg);
            }
        }


        /* Login Card */

        .login-card {
            position: relative;
            z-index: 10;

            width: 100%;
            max-width: 430px;

            border: none;
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.96);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.30);

            overflow: hidden;

            animation: cardEntry 0.8s ease;
        }


        @keyframes cardEntry {

            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* Header */

        .login-header {
            padding: 30px 25px;

            color: white;
            text-align: center;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #4f46e5
                );
        }

        .login-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 32px;

            background: rgba(255, 255, 255, 0.20);

            border: 2px solid rgba(255, 255, 255, 0.35);

            transition: 0.3s;
        }

        .login-icon:hover {
            transform: rotate(10deg) scale(1.1);
        }

        .login-header h2 {
            margin: 0;

            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .login-header p {
            opacity: 0.85;
        }


        /* Body */

        .login-body {
            padding: 32px;
        }


        /* Input */

        .form-label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            padding: 13px 15px;

            border-radius: 12px;

            border: 1px solid #ddd;

            transition: all 0.3s ease;
        }

        .form-control:focus {

            border-color: #4f46e5;

            box-shadow:
                0 0 0 4px rgba(79, 70, 229, 0.12);

            transform: translateY(-2px);
        }


        /* Login Button */

        .btn-login {

            padding: 13px;

            border: none;

            border-radius: 12px;

            font-size: 16px;

            font-weight: 600;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #4f46e5
                );

            transition: all 0.3s ease;
        }

        .btn-login:hover {

            transform: translateY(-3px);

            box-shadow:
                0 10px 25px rgba(13, 110, 253, 0.35);
        }

        .btn-login:active {
            transform: scale(0.97);
        }


        /* Register */

        .register-link {

            color: #4f46e5;

            text-decoration: none;

            font-weight: 700;

            transition: 0.3s;
        }

        .register-link:hover {
            color: #0d6efd;
            text-decoration: underline;
        }


        /* Flash message */

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }


        /* Mobile */

        @media (max-width: 500px) {

            .login-card {
                margin: 20px;
            }

            .login-body {
                padding: 25px;
            }

        }

    </style>

</head>


<body>


<!-- Animated Background -->

<div class="circle circle-one"></div>

<div class="circle circle-two"></div>

<div class="circle circle-three"></div>


<!-- Login Card -->

<div class="login-card">


    <!-- Header -->

    <div class="login-header">

        <div class="login-icon">
            🔐
        </div>

        <h2>
            Employee Login
        </h2>

        <p class="mb-0 mt-2">
            Welcome back! Please login to continue.
        </p>

    </div>


    <!-- Body -->

    <div class="login-body">


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category }} alert-dismissible fade show">

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->

        <form action="/login" method="POST">


            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-primary btn-login w-100">

                🚀 Login

            </button>

        </form>


        <!-- Register -->

        <div class="text-center mt-4">

            <span class="text-muted">
                Don't have an account?
            </span>

            <a
                href="/register"
                class="register-link">

                Register Here

            </a>

        </div>


    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
